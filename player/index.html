<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One Page A Week — Piano</title>
<style>
  :root{
    --bg:#12141a; --panel:#1b1e27; --line:#2c3140; --text:#e8eaf0; --dim:#8b93a7;
    --rh:#4a9eff; --lh:#ff8c42;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,sans-serif;
       -webkit-font-smoothing:antialiased;overflow:hidden}
  #stage{position:fixed;inset:0 0 var(--barh,188px) 0}
  canvas{display:block;width:100%;height:100%}
  #bar{position:fixed;left:0;right:0;bottom:0;height:var(--barh,188px);
       background:var(--panel);border-top:1px solid var(--line);
       padding:10px 16px;display:flex;flex-direction:column;gap:9px}
  .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  button{background:#262b38;color:var(--text);border:1px solid var(--line);
         border-radius:7px;padding:7px 14px;font-size:13px;cursor:pointer;font-weight:500}
  button:hover{background:#303647}
  button.on{background:var(--rh);border-color:var(--rh);color:#06121f}
  button.lh.on{background:var(--lh);border-color:var(--lh)}
  #play{min-width:78px;font-weight:600}
  label{color:var(--dim);font-size:12px;display:flex;align-items:center;gap:7px;white-space:nowrap}
  input[type=range]{width:110px;accent-color:var(--rh)}
  input[type=number]{width:54px;background:#262b38;color:var(--text);
        border:1px solid var(--line);border-radius:5px;padding:5px 7px;font-size:13px}
  select{background:#262b38;color:var(--text);border:1px solid var(--line);
         border-radius:6px;padding:6px 9px;font-size:13px}
  #seek{flex:1;min-width:170px;accent-color:var(--rh)}
  #readout{font-variant-numeric:tabular-nums;color:var(--dim);font-size:12px;min-width:168px}
  #chordnow{font-weight:650;font-size:15px;min-width:72px}
  .sep{width:1px;height:22px;background:var(--line)}
  b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;min-width:34px;display:inline-block}
  #boot{position:fixed;inset:0;display:grid;place-items:center;background:#12141a;
        color:var(--dim);font-size:15px;z-index:9}
</style>
</head>
<body>
<div id="boot">building piano samples…</div>
<div id="stage"><canvas id="c"></canvas></div>

<div id="bar">
  <div class="row">
    <button id="play">Play</button>
    <button id="rew">⟲ Start</button>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <span id="readout">bar 1 · 0:00</span>
    <span id="chordnow">—</span>
  </div>
  <div class="row">
    <button id="btnR" class="on">Right hand</button>
    <button id="btnL" class="lh on">Left hand</button>
    <select id="lhmode" title="how thick the left hand plays">
      <option value="full">LH: as transcribed</option>
      <option value="duo" selected>LH: 2 notes max</option>
      <option value="oct">LH: root + octave</option>
      <option value="roots">LH: roots only</option>
    </select>
    <label>Piano vol <input id="pvol" type="range" min="0" max="100" value="85"></label>
    <div class="sep"></div>
    <label>Speed <input id="speed" type="range" min="10" max="100" value="100"><b id="speedv">100%</b></label>
    <label>Simplify <input id="simp" type="range" min="18" max="80" value="18"><b id="simpv">all</b></label>
  </div>
  <div class="row">
    <label>Play along
      <select id="src">
        <option value="">off</option>
        <option value="song.mp3">full song</option>
        <option value="keys.mp3">keyboard only</option>
      </select>
    </label>
    <label>Overlay vol <input id="ovol" type="range" min="0" max="100" value="55"><b id="ovolv">55</b></label>
    <label>Sync <input id="soff" type="range" min="-200" max="200" value="0"><b id="soffv">0ms</b></label>
    <div class="sep"></div>
    <label><input id="loopOn" type="checkbox"> Loop bars
      <input id="loopA" type="number" value="43" min="1"> –
      <input id="loopB" type="number" value="49" min="1"></label>
    <button id="lick">Lick section</button>
  </div>
  <div class="row">
    <button id="btnP">Percussion</button>
    <label>Perc vol <input id="pcvol" type="range" min="0" max="100" value="45"></label>
    <label>Feel
      <select id="pcstyle">
        <option value="shaker">shaker only</option>
        <option value="full" selected>shaker + side-stick</option>
        <option value="click">click track</option>
      </select>
    </label>
  </div>
</div>

<audio id="ov" preload="auto"></audio>

<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d'), $=id=>document.getElementById(id);
let D=null, LO=29, HI=96, notes=[], W=0,H=0,dpr=1;
let t=0, playing=false, speed=1, simp=18, showR=true, showL=true, last=0;
const PPS=190;
let audio=null, sched=new Set(), pianoGain=null, BUF={}, BASES=[];
let percGain=null, NOISE=null, percOn=false, lastTick=-1;
let syncOff=0, aRef=null, wRef=0;          // overlay clock reference
const ov=$('ov');

/* ---------- acoustic piano: additive multisample ---------- */
function ac(){
  if(!audio){
    audio=new (window.AudioContext||window.webkitAudioContext)();
    pianoGain=audio.createGain(); pianoGain.gain.value=0.85; pianoGain.connect(audio.destination);
    percGain =audio.createGain(); percGain.gain.value=0.45;  percGain.connect(audio.destination);
  }
  return audio;
}

/* ---------- percussion: shaker + side-stick ---------- */
function noiseBuf(){
  if(!NOISE){
    const a=ac(), n=Math.floor(a.sampleRate*0.6);
    NOISE=a.createBuffer(1,n,a.sampleRate);
    const d=NOISE.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  }
  return NOISE;
}
function hit(kind,accent){
  const a=ac(), now=a.currentTime;
  const src=a.createBufferSource(); src.buffer=noiseBuf(); src.loop=true;
  const f=a.createBiquadFilter(), g=a.createGain();
  let dec,amp;
  if(kind==='shaker'){                       // egg shaker: bright, very short
    f.type='bandpass'; f.frequency.value=accent?7600:6600; f.Q.value=1.1;
    dec=accent?0.052:0.030; amp=accent?0.34:0.15;
  } else if(kind==='stick'){                 // rim / side-stick on 2 and 4
    f.type='bandpass'; f.frequency.value=1750; f.Q.value=3.2;
    dec=0.055; amp=0.30;
  } else {                                   // plain click track
    f.type='bandpass'; f.frequency.value=accent?2400:1500; f.Q.value=6;
    dec=0.030; amp=accent?0.38:0.20;
  }
  g.gain.setValueAtTime(0,now);
  g.gain.linearRampToValueAtTime(amp,now+0.0015);
  g.gain.exponentialRampToValueAtTime(0.0004,now+dec);
  src.connect(f); f.connect(g); g.connect(percGain);
  src.start(now, Math.random()*0.5); src.stop(now+dec+0.02);
}
function tickPerc(){
  if(!percOn) return;
  const style=$('pcstyle').value;
  const unit = style==='click' ? D.beat : D.beat/2;          // click on beats, shaker on 8ths
  const i=Math.floor((t-D.downbeat)/unit);
  if(i===lastTick||i<0) return;
  lastTick=i;
  if(style==='click'){ hit('click', i%4===0); return; }
  const off=i%2===1, beatInBar=Math.floor(i/2)%4;
  hit('shaker', !off && beatInBar===0);
  if(style==='full' && !off && (beatInBar===1||beatInBar===3)) hit('stick',false);
}
/* ---------- real recorded piano ----------
   Salamander Grand Piano (Yamaha C5) by Alexander Holm, CC-BY 3.0.
   Sampled every 3 semitones; we pitch-shift at most ±1 semitone to fill gaps,
   which is small enough that the recording keeps its character. */
const SAMPLES={C1:24,Ds1:27,Fs1:30,A1:33,C2:36,Ds2:39,Fs2:42,A2:45,C3:48,Ds3:51,
               Fs3:54,A3:57,C4:60,Ds4:63,Fs4:66,A4:69,C5:72,Ds5:75,Fs5:78,A5:81,
               C6:84,Ds6:87,Fs6:90,A6:93,C7:96};
async function loadPiano(){
  const a=ac(), names=Object.keys(SAMPLES);
  let done=0;
  await Promise.all(names.map(async n=>{
    try{
      const r=await fetch('piano/'+n+'.mp3');
      if(!r.ok) throw 0;
      BUF[SAMPLES[n]]=await a.decodeAudioData(await r.arrayBuffer());
    }catch(e){ /* missing sample: neighbours cover it */ }
    done++;
    $('boot').textContent=`loading piano… ${done}/${names.length}`;
  }));
  BASES=Object.values(SAMPLES).filter(m=>BUF[m]).sort((x,y)=>x-y);
  return BASES.length;
}
function buildPianoFallback(){
  const a=ac(), sr=a.sampleRate;
  BASES=[24,36,48,60,72,84,96];
  for(const base of BASES){
    const f0=440*Math.pow(2,(base-69)/12);
    const dur=Math.max(1.4, 7.0*Math.pow(0.74,(base-24)/12));   // low notes ring far longer
    const n=Math.floor(sr*dur), buf=a.createBuffer(1,n,sr), d=buf.getChannelData(0);
    const B=0.00028+0.0011*Math.max(0,(base-57)/39);            // string stiffness / inharmonicity
    const STRIKE=1/8;                                           // hammer hits ~1/8 along the string
    const nStr = base<40 ? 2 : 3;                               // bass = 2 strings, mid/treble = 3
    const parts=[];
    for(let k=1;k<=34;k++){
      const fk=f0*k*Math.sqrt(1+B*k*k);
      if(fk>sr*0.45) break;
      // strike-point cancellation: notches out the 8th, 16th... partial. Very piano.
      const strikeAmp=Math.abs(Math.sin(Math.PI*k*STRIKE));
      const amp=strikeAmp/Math.pow(k,1.18);
      // double decay: quick initial loss, then a long tail (two string polarisations)
      const fast=(dur*0.16)/Math.pow(k,0.80);
      const slow=(dur*1.00)/Math.pow(k,0.42);
      for(let s=0;s<nStr;s++){
        // unison strings detuned a fraction of a cent — this is the shimmer
        const cents=(s-(nStr-1)/2)*(base<40?1.4:0.9);
        parts.push({w:2*Math.PI*fk*Math.pow(2,cents/1200),
                    a:amp/nStr, fast, slow, ph:Math.random()*6.283});
      }
    }
    let peak=0;
    // hammer thump: lowpassed noise, one-pole
    let lp=0, lpc=Math.exp(-2*Math.PI*900/sr);
    for(let i=0;i<n;i++){
      const s=i/sr; let v=0;
      for(const p of parts)
        v += p.a*(0.62*Math.exp(-s/p.fast)+0.38*Math.exp(-s/p.slow))*Math.sin(p.w*s+p.ph);
      lp = lpc*lp + (1-lpc)*(Math.random()*2-1);
      if(s<0.035) v += lp*0.55*Math.exp(-s/0.007);              // felt hammer contact
      if(s<0.004) v *= s/0.004;                                 // no click at t=0
      d[i]=v; const av=Math.abs(v); if(av>peak) peak=av;
    }
    const g=0.9/(peak||1);
    for(let i=0;i<n;i++) d[i]*=g;
    BUF[base]=buf;
  }
}
const nearestBase = m => BASES.reduce((b,x)=>Math.abs(x-m)<Math.abs(b-m)?x:b,BASES[0]);
function playNote(midi,dur,vel,hand){
  const a=ac(), base=nearestBase(midi), buf=BUF[base];
  if(!buf) return;
  const src=a.createBufferSource(); src.buffer=buf;
  src.playbackRate.value=Math.pow(2,(midi-base)/12);
  const v=Math.max(0,Math.min(1,vel/127));
  // The samples are recorded at one strike strength, so shape dynamics ourselves:
  // softer notes are darker, not merely quieter.
  const lp=a.createBiquadFilter();
  lp.type='lowpass';
  lp.frequency.value=Math.min(18000, 1400+15000*Math.pow(v,1.25));
  lp.Q.value=0.4;
  const g=a.createGain();
  const amp=(0.20+0.80*Math.pow(v,1.2))*(hand==='l'?0.86:1)*0.85;
  const now=a.currentTime, hold=Math.max(0.10,Math.min(dur/speed,4.0));
  g.gain.setValueAtTime(amp,now);
  g.gain.setValueAtTime(amp,now+hold);
  g.gain.exponentialRampToValueAtTime(0.0006,now+hold+0.30);    // felt damper, not a hard cut
  src.connect(lp); lp.connect(g); g.connect(pianoGain);
  src.start(now); src.stop(now+hold+0.40);
}

/* ---------- geometry ---------- */
const BLACK=[1,3,6,8,10], isBlack=p=>BLACK.includes(((p%12)+12)%12);
function whiteCount(a,b){let n=0;for(let i=a;i<b;i++) if(!isBlack(i))n++;return n;}
let nWhite=0,wKeyW=0,KEYTOP=0,KEYH=0;
function geom(){ nWhite=whiteCount(LO,HI+1); wKeyW=W/nWhite;
  KEYH=Math.min(150,Math.max(84,H*0.22)); KEYTOP=H-KEYH; }
function keyRect(p){
  const wi=whiteCount(LO,p);
  return isBlack(p) ? {x:wi*wKeyW-wKeyW*0.30,w:wKeyW*0.60,black:true}
                    : {x:wi*wKeyW,w:wKeyW,black:false};
}
function resize(){ dpr=window.devicePixelRatio||1;
  const r=cv.getBoundingClientRect(); W=r.width; H=r.height;
  cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); geom(); }
addEventListener('resize',resize);

/* ---------- helpers ---------- */
const barOf = s => Math.floor((s-D.downbeat)/D.bar)+1;
const timeOfBar = b => D.downbeat+(b-1)*D.bar;
/* ---------- left-hand thinning ----------
   Low stacked notes go muddy and no pianist voices them that way. Group the LH by
   attack instant, then keep only what a hand would realistically play down there. */
let lhGroups=null, lhAllow=null;
function buildLHGroups(){
  lhGroups=new Map();
  for(const n of notes){
    if(n.h!=='l') continue;
    const k=Math.round(n.t*1000);
    if(!lhGroups.has(k)) lhGroups.set(k,[]);
    lhGroups.get(k).push(n);
  }
}
function applyLH(){
  const mode=$('lhmode').value;
  lhAllow=new Set();
  for(const arr of lhGroups.values()){
    const s=arr.slice().sort((a,b)=>a.p-b.p);
    let keep;
    if(mode==='full') keep=s;
    else if(mode==='roots') keep=[s[0]];
    else if(mode==='oct'){
      const oct=s.find(n=>n.p===s[0].p+12);
      keep = oct ? [s[0],oct] : [s[0]];
    } else {                                   // duo: bottom + top of the voicing
      keep = s.length<2 ? [s[0]] : [s[0], s[s.length-1]];
      if(s[0].p<40) keep=[s[0]];                            // very low: one note only
      if(keep.length===2 && keep[1].p-keep[0].p<5 && keep[0].p<48) keep=[keep[0]];
    }
    for(const n of keep) lhAllow.add(n);
  }
}
const visible = n => n.v>=simp &&
  (n.h==='r' ? showR : (showL && (!lhAllow || lhAllow.has(n))));
function chordAt(s){ let c='—'; for(const k of D.chords){ if(k.t<=s+0.02) c=k.name; else break; } return c; }
const fmt = s => `${Math.floor(Math.max(s,0)/60)}:${String(Math.floor(Math.max(s,0)%60)).padStart(2,'0')}`;
const absTime = s => s + D.downbeat + syncOff;   // player clock -> audio file clock

/* ---------- overlay sync ----------
   When an overlay is playing it is the MASTER clock: visuals read from it and
   interpolate between its coarse updates. Two clocks can't drift if there's one clock. */
const ovLive = () => !!$('src').value && ov.readyState>=2;
function syncOverlay(force){
  if(!ovLive()) return;
  ov.playbackRate=speed;
  if(force){ ov.currentTime=Math.max(0,absTime(t)); aRef=null; }
  if(playing && ov.paused) ov.play().catch(()=>{});
  if(!playing && !ov.paused) ov.pause();
}

/* ---------- loop ---------- */
function frame(ts){
  if(!D){ requestAnimationFrame(frame); return; }
  const dt=last?Math.min((ts-last)/1000,0.05):0; last=ts;
  if(playing){
    // one clock: if an overlay is running, it drives time; otherwise the frame loop does
    if(ovLive() && !ov.paused){
      const ct=ov.currentTime, wall=ts/1000;
      if(aRef===null || Math.abs(ct-aRef)>0.0005){ aRef=ct; wRef=wall; }
      t = (aRef + (wall-wRef)*speed) - D.downbeat - syncOff;
    } else {
      aRef=null; t+=dt*speed;
    }
    if($('loopOn').checked){
      const a=timeOfBar(+$('loopA').value), b=timeOfBar(+$('loopB').value+1);
      if(t>=b||t<a-0.001){ t=a; sched.clear(); lastTick=-1; syncOverlay(true); }
    }
    if(t>D.duration){ t=D.duration; playing=false; $('play').textContent='Play'; syncOverlay(); }
    for(const n of notes){
      if(n.t>t) break;
      if(n.t>t-0.09 && visible(n) && !sched.has(n)){ sched.add(n); playNote(n.p,n.d,n.v,n.h); }
    }
    if(sched.size>500) sched.clear();
    tickPerc();
  }
  render();
  requestAnimationFrame(frame);
}

function roundRect(x,y,w,h,r){ ctx.beginPath();
  const rr=Math.min(r,w/2,h/2);
  ctx.moveTo(x+rr,y); ctx.arcTo(x+w,y,x+w,y+h,rr); ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr); ctx.arcTo(x,y,x+w,y,rr); ctx.closePath(); }

function render(){
  ctx.fillStyle='#12141a'; ctx.fillRect(0,0,W,H);
  const look=KEYTOP/PPS;
  ctx.font='11px ui-monospace,SFMono-Regular,monospace';
  for(let b=Math.max(1,barOf(t)); b<=barOf(t+look)+1; b++){
    const y=KEYTOP-(timeOfBar(b)-t)*PPS;
    if(y<-30||y>KEYTOP) continue;
    ctx.strokeStyle='#232838'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    ctx.fillStyle='#5a6178'; ctx.fillText(b,6,y-4);
  }
  for(const n of notes){
    if(n.t>t+look) break;
    if(n.t+n.d<t-0.15 || !visible(n)) continue;
    const k=keyRect(n.p), yEnd=KEYTOP-(n.t-t)*PPS, h=Math.max(4,n.d*PPS), y=yEnd-h;
    if(yEnd<0) continue;
    const on = n.t<=t && t<n.t+n.d;
    ctx.fillStyle = n.h==='r' ? (on?'#8fc4ff':'#4a9eff') : (on?'#ffb27a':'#ff8c42');
    const pad=k.black?1.5:2.5;
    roundRect(k.x+pad,Math.max(y,-40),Math.max(k.w-pad*2,3),Math.min(h,KEYTOP-y+40),3);
    ctx.fill();
  }
  const active=new Map();
  for(const n of notes){ if(n.t>t) break;
    if(t<n.t+n.d && visible(n)) active.set(n.p,n.h); }
  ctx.fillStyle='#0b0d12'; ctx.fillRect(0,KEYTOP-3,W,3);
  for(let p=LO;p<=HI;p++){ if(isBlack(p)) continue;
    const k=keyRect(p), a=active.get(p);
    ctx.fillStyle=a?(a==='r'?'#4a9eff':'#ff8c42'):'#f4f5f8';
    ctx.fillRect(k.x,KEYTOP,k.w-1,KEYH);
    if(p%12===0){ ctx.fillStyle=a?'#06121f':'#9aa1b4'; ctx.font='9px system-ui';
      ctx.fillText('C'+(Math.floor(p/12)-1),k.x+2,KEYTOP+KEYH-5); } }
  for(let p=LO;p<=HI;p++){ if(!isBlack(p)) continue;
    const k=keyRect(p), a=active.get(p);
    ctx.fillStyle=a?(a==='r'?'#2f7fd6':'#d66d24'):'#171a22';
    ctx.fillRect(k.x,KEYTOP,k.w,KEYH*0.62); }
  $('readout').textContent=`bar ${Math.max(1,barOf(t))} · ${fmt(t)} / ${fmt(D.duration)}`;
  $('chordnow').textContent=chordAt(t);
  const s=$('seek'); if(document.activeElement!==s) s.value=Math.round(t/D.duration*1000);
}

/* ---------- controls ---------- */
$('play').onclick=()=>{ ac().resume(); playing=!playing; sched.clear();
  $('play').textContent=playing?'Pause':'Play'; syncOverlay(true); };
$('rew').onclick=()=>{ t=0; sched.clear(); lastTick=-1; syncOverlay(true); };
$('seek').oninput=e=>{ t=e.target.value/1000*D.duration; sched.clear(); lastTick=-1; syncOverlay(true); };
$('btnP').onclick=()=>{ ac().resume(); percOn=!percOn; lastTick=-1;
  $('btnP').classList.toggle('on',percOn); };
$('pcvol').oninput=e=>{ if(percGain) percGain.gain.value=e.target.value/100; };
$('pcstyle').onchange=()=>{ lastTick=-1; };
$('soff').oninput=e=>{ syncOff=+e.target.value/1000;
  $('soffv').textContent=e.target.value+'ms'; aRef=null; syncOverlay(true); };
$('btnR').onclick=()=>{ showR=!showR; $('btnR').classList.toggle('on',showR); };
$('btnL').onclick=()=>{ showL=!showL; $('btnL').classList.toggle('on',showL); };
$('lhmode').onchange=()=>{ applyLH(); sched.clear(); };
$('speed').oninput=e=>{ speed=e.target.value/100; $('speedv').textContent=e.target.value+'%'; syncOverlay(true); };
$('simp').oninput=e=>{ simp=+e.target.value;
  $('simpv').textContent= simp<=18?'all':(simp>=60?'sparse':'med'); };
$('pvol').oninput=e=>{ if(pianoGain) pianoGain.gain.value=e.target.value/100; };
$('ovol').oninput=e=>{ ov.volume=e.target.value/100; $('ovolv').textContent=e.target.value; };
$('src').onchange=e=>{
  if(!e.target.value){ ov.pause(); ov.removeAttribute('src'); return; }
  ov.src=e.target.value; ov.volume=$('ovol').value/100; ov.load();
  ov.onloadedmetadata=()=>syncOverlay(true);
};
$('lick').onclick=()=>{ $('loopA').value=43; $('loopB').value=49; $('loopOn').checked=true;
  t=timeOfBar(43); sched.clear(); syncOverlay(true); if(!playing) $('play').click(); };
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(e.code==='Space'){ e.preventDefault(); $('play').click(); }
  if(e.code==='ArrowLeft'){ t=Math.max(0,t-D.bar); sched.clear(); syncOverlay(true); }
  if(e.code==='ArrowRight'){ t=Math.min(D.duration,t+D.bar); sched.clear(); syncOverlay(true); }
});
setInterval(()=>{ if(playing) syncOverlay(false); },700);

/* ---------- boot ---------- */
fetch('notes.json').then(r=>r.json()).then(d=>{
  D=d; notes=d.notes; LO=d.range[0]; HI=d.range[1];
  $('loopA').max=d.nbars; $('loopB').max=d.nbars;
  resize(); buildLHGroups(); applyLH();
  $('boot').textContent='loading piano…';
  loadPiano().then(n=>{
    if(!n){ $('boot').textContent='samples missing — using modelled piano';
            buildPianoFallback(); }
    $('boot').style.display='none';
    requestAnimationFrame(frame);
  }).catch(()=>{ buildPianoFallback(); $('boot').style.display='none';
                 requestAnimationFrame(frame); });
});
</script>
</body>
</html>
